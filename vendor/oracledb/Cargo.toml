# oracledb 26.0.0-beta.6 from crates.io, patched for SpelaionDB: read PATCHED.md before changing
# or upgrading it. Only the library is kept (no examples, tests or binaries).
[package]
edition = "2024"
rust-version = "1.89"
name = "oracledb"
version = "26.0.0-beta.6"
authors = ["Oracle and/or its affiliates"]
description = "Lightweight driver for Oracle Database (patched for SpelaionDB)"
readme = "README.md"
license = "UPL-1.0 OR Apache-2.0"
repository = "https://github.com/oracle/rust-oracledb"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[features]
arrow = ["dep:arrow-array", "dep:arrow-schema"]

[lib]
name = "oracledb"
path = "src/lib.rs"
doctest = false

[dependencies]
aes = "0.9.1"
arrow-array = { version = "60.1.0", optional = true }
arrow-schema = { version = "60.1.0", optional = true }
base16ct = { version = "1.0.0", features = ["alloc"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
cbc = "0.2.1"
chrono = "0.4.45"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
pkcs8 = { version = "0.11.0", features = ["pem", "encryption"] }
rand = "0.10.2"
# Patched: no default features, so aws-lc-rs (CMake and NASM on Windows) is never built; ring is
# the provider (PATCHED.md, 4).
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
uuid = { version = "1.24.0", features = ["v4"] }
webpki-roots = "1.0.8"
whoami = "2.1.2"
