[package]
name = "spelaiondb-plugin-oracle"
description = "Oracle Database for SpelaionDB: the engine's driver, served as a plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-oracle"
publish = false

[lib]
name = "spelaion_driver_oracle"

[[bin]]
name = "spelaiondb-plugin-oracle"
path = "src/bin/spelaiondb-plugin-oracle.rs"

# The contract and the plugin's side of the protocol come from SpelaionDB's repository, by tag
# (ADR-042): they are one workspace there, so one tag pins them together. Moving the tag is how
# this plugin follows a protocol change.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.0" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.0" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged.
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
futures-util = "0.3"
# Oracle's own thin driver (ADR-059 in SpelaionDB): pure Rust, no Oracle client library. A
# pre-release, pinned exactly and patched (vendor/oracledb/PATCHED.md); moved on purpose, with
# this plugin's tests as the gate.
oracledb = "=26.0.0-beta.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.0" }

# oracledb as this repository patched it: read vendor/oracledb/PATCHED.md before upgrading.
[patch.crates-io]
oracledb = { path = "vendor/oracledb" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
